server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    include /etc/nginx/security-headers.conf;

    # Cache static assets (noms hashés)
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy backend IA vision (préfixe /api/ strippé). Réponses jamais mises en cache (photos, données perso).
    # X-Real-IP : posé par le reverse proxy VPS (IP client réelle, clé du rate-limit) → transmis tel quel.
    location /api/ {
        proxy_pass http://muscugain-backend:8000/;
        client_max_body_size 10m;
        proxy_read_timeout 90s;
        proxy_set_header Host $host;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Service worker & manifest : toujours revalider (évite un SW figé)
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
    location = /registerSW.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        expires off;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }

    # SPA fallback (index.html revalidé : nouvelle version visible au prochain lancement)
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
