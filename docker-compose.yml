version: '3.8'

services:
  # Application MuscuGain - expose uniquement en interne
  muscugain:
    build: .
    container_name: muscugain-app
    expose:
      - 80
    networks:
      - vps-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  # Connecté au réseau du reverse proxy existant du VPS
  vps-network:
    external: true
    name: vps-network
