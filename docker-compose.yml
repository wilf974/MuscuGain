services:
  # Application MuscuGain
  muscugain:
    build: .
    container_name: muscugain-app
    security_opt:
      - no-new-privileges:true
    expose:
      - 80
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - vps-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  muscugain-backend:
    build: ./backend
    container_name: muscugain-backend
    env_file: backend/.env
    security_opt:
      - no-new-privileges:true
    expose:
      - 8000
    networks:
      - vps-network
    restart: unless-stopped

networks:
  # Connecté au réseau du reverse proxy existant du VPS
  vps-network:
    external: true
    name: vps-network
